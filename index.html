<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fed25d-js-inl-2-budget-app-ngeliecode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Lilita+One&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="dark">
    <div class="wrapper">
      <main class="app">
        <header>
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            title="Toggle theme"
            aria-label="Toggle theme"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              class="svg svg--sun-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              />
            </svg>

            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              class="svg svg--moon-icon"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
              />
            </svg>
          </button>
          <h1>Budgetkollen</h1>
        </header>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="wave"
          viewBox="0 0 1440 320"
        >
          <path
            d="M0,288L48,256C96,224,192,160,288,138.7C384,117,480,139,576,170.7C672,203,768,245,864,229.3C960,213,1056,139,1152,122.7C1248,107,1344,149,1392,170.7L1440,192L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"
          ></path>
        </svg>
        <main>
          <section>
            <h2>Inkomster</h2>

            <form>
              <div class="category">
                <label class="visually-hidden">Kategori</label>
                <select id="incomeCategory">
                  <!-- dropdown-options renderas här -->
                </select>
              </div>

              <div class="description">
                <label class="visually-hidden">Beskrivning</label>
                <input
                  type="text"
                  id="incomeDescription"
                  class="income-description"
                  name="income-description"
                  placeholder="Beskrivning (t.ex. CSN)"
                />
              </div>

              <div class="amount">
                <label class="visually-hidden">Summa</label>
                <input
                  type="number"
                  id="incomeAmount"
                  class="income-amount"
                  name="income-amount"
                  placeholder="Belopp"
                />
              </div>

              <button
                type="button"
                class="btn btn--add-income"
                id="addIncomeItemBtn"
              >
                Lägg till
              </button>
            </form>

            <ul class="budgetpost-list" id="incomeList">
              <!-- budgetposter renderas här -->
            </ul>
          </section>

          <section>
            <h2>Utgifter</h2>

            <form>
              <div class="category">
                <label class="visually-hidden">Kategori</label>
                <select id="expenseCategory">
                  <!-- dropdown-options renderas här -->
                </select>
              </div>

              <div class="description">
                <label class="visually-hidden">Beskrivning</label>
                <input
                  type="text"
                  id="expenseDescription"
                  class="expense-description"
                  name="expense-description"
                  placeholder="T.ex. Hyra"
                />
              </div>

              <div class="amount">
                <label class="visually-hidden">Summa</label>
                <input
                  type="number"
                  id="expenseAmount"
                  class="expense-amount"
                  name="expense-amount"
                />
              </div>

              <button
                type="button"
                class="btn btn--add-expense"
                id="addExpenseItemBtn"
              >
                Lägg till
              </button>
            </form>

            <ul class="budgetpost-list" id="expenseList">
              <!-- budgetpost renderas här (kategori, beskrivning, belopp) -->
            </ul>
          </section>

          <section>
            <h2>Balans</h2>
            <p class="balance" id="balanceNumber" aria-live="polite">
              0 kr<!-- Här renderar ts ut ett nummer/manipulerar numret -->
            </p>
          </section>
        </main>
        <footer>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Unde, enim
          qui! Voluptates in illo placeat labore nobis sunt ducimus sed!
          Deleniti molestiae accusantium quidem pariatur, aspernatur velit
          accusamus cum culpa!
        </footer>
        <script type="module" src="/src/main.ts"></script>
      </main>
    </div>
  </body>
</html>
