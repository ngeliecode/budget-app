<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fed25d-js-inl-2-budget-app-ngeliecode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Lilita+One&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app">
      <header>
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            class="theme-toggle__dark-side"
            viewBox="0 0 32 32"
          >
            <path
              d="M16 .5C7.4.5.5 7.4.5 16S7.4 31.5 16 31.5 31.5 24.6 31.5 16 24.6.5 16 .5zm0 28.1V3.4C23 3.4 28.6 9 28.6 16S23 28.6 16 28.6z"
            />
          </svg>
        </button>
        <h1>Budgetkollen</h1>
      </header>
      <svg
        class="wavy-header"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1440 320"
      >
        <path
          fill-opacity="1"
          d="M0,96L20,122.7C40,149,80,203,120,234.7C160,267,200,277,240,250.7C280,224,320,160,360,117.3C400,75,440,53,480,58.7C520,64,560,96,600,96C640,96,680,64,720,74.7C760,85,800,139,840,181.3C880,224,920,256,960,272C1000,288,1040,288,1080,272C1120,256,1160,224,1200,181.3C1240,139,1280,85,1320,106.7C1360,128,1400,224,1420,272L1440,320L1440,0L1420,0C1400,0,1360,0,1320,0C1280,0,1240,0,1200,0C1160,0,1120,0,1080,0C1040,0,1000,0,960,0C920,0,880,0,840,0C800,0,760,0,720,0C680,0,640,0,600,0C560,0,520,0,480,0C440,0,400,0,360,0C320,0,280,0,240,0C200,0,160,0,120,0C80,0,40,0,20,0L0,0Z"
        ></path>
      </svg>
      <main>
        <section>
          <h2></h2>
          <p>The fun way to keep track of your finances.</p>
        </section>
        <section>
          <h2>Inkomster</h2>

          <form>
            <div>
              <label>Kategori</label>
              <select id="incomeCategory">
                <!-- dropdown-options renderas här -->
              </select>
            </div>

            <div>
              <label>Beskrivning</label>
              <input
                type="text"
                id="incomeDescription"
                class="income-description"
                name="income-description"
              />
            </div>

            <div>
              <label>Summa</label>
              <input
                type="number"
                id="incomeAmount"
                class="income-amount"
                name="income-amount"
              />
            </div>

            <button
              type="button"
              class="btn btn--add-income"
              id="addIncomeItemBtn"
            >
              Lägg till
            </button>
          </form>

          <ul id="incomeList">
            <!-- budgetpost renderas här (kategori, beskrivning, belopp) -->
          </ul>
        </section>

        <section>
          <h2>Utgifter</h2>

          <form>
            <div>
              <label>Kategori</label>
              <select id="expenseCategory">
                <!-- dropdown-options renderas här -->
              </select>
            </div>

            <div>
              <label>Beskrivning</label>
              <input
                type="text"
                id="expenseDescription"
                class="expense-description"
                name="expense-description"
              />
            </div>

            <div>
              <label>Summa</label>
              <input
                type="number"
                id="expenseAmount"
                class="expense-amount"
                name="expense-amount"
              />
            </div>

            <button
              type="button"
              class="btn btn--add-expense"
              id="addExpenseItemBtn"
            >
              Lägg till
            </button>
          </form>

          <ul id="expenseList">
            <!-- budgetpost renderas här (kategori, beskrivning, belopp) -->
          </ul>
        </section>

        <section class="balance">
          <h2>Balans</h2>
          <p id="balanceNumber">
            0 kr<!-- Här renderar ts ut ett nummer/manipulerar numret -->
          </p>
        </section>
      </main>
      <footer></footer>
      <script type="module" src="/src/main.ts"></script>
    </div>
  </body>
</html>
