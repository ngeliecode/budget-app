<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fed25d-js-inl-2-budget-app-ngeliecode</title>
  </head>

  <body>
    <header>
      <h1>Budgetkollen</h1>
    </header>

    <main>
      <section>
        <h2>Inkomster</h2>

        <form>
          <div>
            <label>Kategori</label>
            <select id="incomeCategory">
              <!-- dropdown-options renderas här -->
            </select>
          </div>

          <div>
            <label>Beskrivning</label>
            <input
              type="text"
              id="incomeDescription"
              class="income-description"
              name="income-description"
            />
          </div>

          <div>
            <label>Summa</label>
            <input
              type="number"
              id="incomeAmount"
              class="income-amount"
              name="income-amount"
            />
          </div>

          <button type="button" id="addIncomeItemBtn">Lägg till</button>
        </form>

        <ul id="incomeList">
          <!-- budgetpost renderas här (kategori, beskrivning, belopp) -->
        </ul>
      </section>

      <section>
        <h2>Utgifter</h2>

        <form>
          <div>
            <label>Kategori</label>
            <select id="expenseCategory">
              <!-- dropdown-options renderas här -->
            </select>
          </div>

          <div>
            <label>Beskrivning</label>
            <input
              type="text"
              id="expenseDescription"
              class="expense-description"
              name="expense-description"
            />
          </div>

          <div>
            <label>Summa</label>
            <input
              type="number"
              id="expenseAmount"
              class="expense-amount"
              name="expense-amount"
            />
          </div>

          <button type="button" id="addExpenseItemBtn">Lägg till</button>
        </form>

        <ul id="expenseList">
          <!-- budgetpost renderas här (kategori, beskrivning, belopp) -->
        </ul>
      </section>

      <section>
        <h2>Balans</h2>
        <p id="balanceNumber">0 kr</p>
      </section>
    </main>

    <footer></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
