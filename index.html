<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fed25d-js-inl-2-budget-app-ngeliecode</title>
  </head>
  <body>
    <header>
      <h1>Budgetkollen</h1>
    </header>
    <main>
      <section>
        <h2>Inkomster</h2>
        <form>
          <div>
            <label>Kategorisera inkomst</label>
            <select id="incomeCategory">
              <option value="">Välj kategori</option>
              <option value="Lön">Lön</option>
              <option value="CSN">Bidrag</option>
              <option value="Fonder och aktier">Övrigt</option>
            </select>
          </div>
          <div>
            <label>Summa</label>
            <input
              type="number"
              id="incomeAmount"
              class="income-amount"
              name="income-amount"
            />
          </div>
          <button type="button" id="addIncomeItemBtn">Lägg till</button>
        </form>
        <ul id="incomeList">
          <!-- inkomster renderas här -->
        </ul>
      </section>

      <section>
        <h2>Utgifter</h2>
        <form>
          <div>
            <label>Kategorisera utgift</label>
            <select id="expenseCategory">
              <option value="">Välj kategori</option>
              <option value="Lön">Lön</option>
              <option value="CSN">Bidrag</option>
              <option value="Fonder och aktier">Övrigt</option>
            </select>
          </div>

          <div>
            <label>Summa</label>
            <input
              type="number"
              id="expenseAmount"
              class="expense-amount"
              name="expense-amount"
            />
          </div>
          <button type="button" id="addExpenseItemBtn">Lägg till</button>
        </form>

        <ul id="expenseList">
          <!-- ugifter renderas här -->
        </ul>
      </section>

      <section>
        <h2>Balans</h2>
      </section>
    </main>
    <footer></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
